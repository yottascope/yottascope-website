<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nice try. | Yottascope</title>
<style>
  :root {
    --bg: #0342b8;
    --ink: #ffffff;
    --accent: #6fe7fb;
    --muted: #b9d3ff;
    --panel: #02307f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #0342b8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Rockwell, "Roboto Slab", "Courier New", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  main { max-width: 34rem; width: 100%; }
  h1 {
    font-size: clamp(3.5rem, 16vw, 7rem);
    line-height: 0.95;
    margin: 0 0 1.25rem;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  p { margin: 0 0 1rem; font-size: 1.125rem; }
  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.875rem;
  }
  a {
    color: var(--accent);
    font-weight: 700;
    text-underline-offset: 4px;
  }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Nice <span>try.</span></h1>
  <p>There is no admin panel here. Only a very smug 403.</p>
  <a href="/">Back to Yottascope</a>
  <footer>&copy; 2026 Yottascope</footer>
</main>
</body>
</html>
